# AgriMitra local infrastructure — MongoDB for the structured crop database.
# Usage:  docker compose up -d mongo
services:
  mongo:
    image: mongo:7.0
    container_name: agrimitra-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mongo_data: